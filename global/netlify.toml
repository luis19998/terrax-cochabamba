# Static site in web/ plus one function that serves /api/* (see netlify/functions/api.mjs).
# Set GAMC_API_KEY in the site's environment variables to enable the municipal map layers.
[build]
  publish = "web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The model name and the public GAMC service address appear in the code as defaults: they are not secrets.
# The real keys (GEMINI_API_KEY, GAMC_API_KEY) are still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL,GAMC_WMS_URL"
